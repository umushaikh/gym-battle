<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Iron Log</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app" class="app">
  <header class="topbar">
    <div class="brand">💪 Iron Log</div>
  </header>

  <main class="content">

    <section id="tab-workout" class="tab-panel active">
      <div id="workout-start" class="workout-start">
        <button id="start-empty-btn" class="primary-btn big">+ Start Empty Workout</button>

        <div class="section-header">
          <h2>Routines</h2>
          <button id="new-routine-btn" class="link-btn">+ New routine</button>
        </div>
        <div id="routines-list" class="list"></div>
      </div>

      <div id="workout-active" class="workout-active hidden">
        <div class="active-header">
          <input id="active-workout-name" class="workout-name-input" />
          <div class="active-timer" id="active-timer">0:00</div>
        </div>
        <div id="active-exercises" class="active-exercises"></div>
        <button id="add-exercise-btn" class="secondary-btn full">+ Add Exercise</button>
        <div class="active-actions">
          <button id="cancel-workout-btn" class="danger-btn">Cancel</button>
          <button id="finish-workout-btn" class="primary-btn">Finish Workout</button>
        </div>
      </div>
    </section>

    <section id="tab-history" class="tab-panel">
      <h2 class="panel-title">History</h2>
      <div id="history-list" class="list"></div>
    </section>

    <section id="tab-exercises" class="tab-panel">
      <h2 class="panel-title">Exercises</h2>
      <div class="row">
        <input id="exercise-search" class="search-input" placeholder="Search exercises" />
        <button id="new-exercise-btn" class="secondary-btn">+ New</button>
      </div>
      <div id="new-exercise-form" class="card hidden">
        <label>Name
          <input id="new-exercise-name" placeholder="e.g. Cable Fly" />
        </label>
        <div class="row">
          <label>Category
            <input id="new-exercise-category" placeholder="e.g. Chest" />
          </label>
          <label>Equipment
            <input id="new-exercise-equipment" placeholder="e.g. Cable" />
          </label>
        </div>
        <button id="save-new-exercise-btn" class="primary-btn">Add Exercise</button>
      </div>
      <div id="category-filters" class="chip-row"></div>
      <div id="exercises-library-list" class="list"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tabbar-btn active" data-tab="workout"><span class="icon">🏋️</span>Workout</button>
    <button class="tabbar-btn" data-tab="history"><span class="icon">📅</span>History</button>
    <button class="tabbar-btn" data-tab="exercises"><span class="icon">📋</span>Exercises</button>
  </nav>
</div>

<div id="exercise-picker" class="modal hidden">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>Add Exercise</h2>
      <button id="close-picker-btn" class="link-btn">Close</button>
    </div>
    <input id="picker-search" class="search-input" placeholder="Search exercises" />
    <div id="picker-list" class="list scrollable"></div>
  </div>
</div>

<div id="detail-modal" class="modal hidden">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="detail-title">Detail</h2>
      <button id="close-detail-btn" class="link-btn">Close</button>
    </div>
    <div id="detail-body" class="scrollable"></div>
  </div>
</div>

<div id="routine-modal" class="modal hidden">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="routine-modal-title">New Routine</h2>
      <button id="close-routine-btn" class="link-btn">Close</button>
    </div>
    <div class="scrollable">
      <label>Routine name
        <input id="routine-name-input" placeholder="e.g. Push Day" />
      </label>
      <div id="routine-exercises" class="active-exercises"></div>
      <button id="routine-add-exercise-btn" class="secondary-btn full">+ Add Exercise</button>
    </div>
    <button id="save-routine-btn" class="primary-btn">Save Routine</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
